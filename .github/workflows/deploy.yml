name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare artifact (add .nojekyll)
        run: |
          echo "Ensuring artifact prepared..."
          if [ -d dist ]; then
            touch dist/.nojekyll
            ls -la dist | sed -n '1,50p'
          else
            echo "dist/ not found, aborting"
            exit 1
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://$GITHUB_REPOSITORY_OWNER.github.io/${{ github.repository }}

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
